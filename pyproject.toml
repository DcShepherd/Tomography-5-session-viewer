[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomography-session-browser"
version = "1.1.0"
description = "Read-only Tomography 5 session browser."
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.2",
    "Pillow>=10",
    "numpy>=1.26",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
tomo_session_viewer = "tomography_session_browser.main:main"

[tool.setuptools.package-data]
tomography_session_browser = [
    "services/volume/*.pyi",
    "assets/icons/*.svg",
    "assets/branding/*.svg",
    "assets/sprites/*.png",
    "assets/sprites/*.json",
    "assets/loader/*.qml",
    "assets/loader/*.qsb",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
