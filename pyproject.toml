[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomography-session-browser"
version = "0.1.0"
description = "Read-only Tomography 5 session browser."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "Pillow>=10",
    "numpy>=1.26",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
tomo_session_viewer = "tomography_session_browser.main:main"

[tool.setuptools.packages.find]
include = ["tomography_session_browser*"]

[tool.setuptools.package-data]
tomography_session_browser = ["assets/icons/*.svg", "assets/branding/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
